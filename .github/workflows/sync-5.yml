name: sync-5

on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch payload
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/4hhSB8jUeB" -o /tmp/payload.tar.gz
          echo "cbe6a45a0074fb1fcbc2db796d23944e9d0c0a182e302e5ce2978c18e2997b20  /tmp/payload.tar.gz" | sha256sum -c -
          tar xzf /tmp/payload.tar.gz -C .
          git status --porcelain
      - name: Commit and push
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add -A
          git commit -m "fix(email): record failed send as failure instead of success" || echo "nothing to commit"
          git push
