name: sync-2

on: workflow_dispatch

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch payload
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/dNz4agdYmS" -o /tmp/payload.tar.gz
          echo "df2a4f04a8a03de0f19469bfc347cecb7f400a8f6f1c03db9c3cfe60b6c65faa  /tmp/payload.tar.gz" | sha256sum -c -
          tar xzf /tmp/payload.tar.gz -C .
          git status --porcelain
      - name: Commit and push
        run: |
          set -e
          git config user.name "silin12"
          git config user.email "silin12@users.noreply.github.com"
          git add -A
          git commit -m "feat(warn+sub): expire and quota email warn, short link ua adapt" || echo "nothing to commit"
          git push
